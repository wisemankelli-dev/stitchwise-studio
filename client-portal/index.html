<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StitchWise Studio - Premium Embroidery Patterns</title>
    <script>
      // HashRouter direct-link support: rewrite pathname routes (e.g. /pricing,
      // /login, /designer) to their hash form (/app/#/pricing) before the app boots.
      (function () {
        var p = window.location.pathname.replace(/\/+$/, '');
        if (!window.location.hash && p && p !== '/app') {
          window.location.replace('/app/#' + p);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
